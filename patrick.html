.nhi-ui {
  --n-background:#fff; --n-canvas:#f2f4f2; --n-foreground:#202622; --n-muted:#606b63;
  --n-line:#d9dfd8; --n-input-border:#89958b; --n-soft:#f2f4f2; --n-selected:#e5e9e5;
  --n-action:#83bf3e; --n-action-text:#14230e; --n-action-hover:#96ce54; --n-action-pressed:#75ad35;
  --n-focus:#303833; --n-disabled-bg:#e8ebe7; --n-disabled-text:#737b73;
  --n-error:#9c382c; --n-error-bg:#fcf1ed; --n-example:#75511e; --n-example-bg:#faf4e8; --n-example-border:#dfcba7;
  --n-danger:#9c382c; --n-danger-text:#fff; --n-danger-hover:#852e24; --n-danger-pressed:#70271f;
  --n-radius:4px; --n-control-height:46px; --n-control-inset:18px; --n-gap:10px;
  --n-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --n-mono:var(--n-font); /* Compatibility alias: identifiers use the same UI family. */
  --n-type-title:36px; --n-type-section:22px; --n-type-subhead:16px; --n-type-body:14px; --n-type-caption:12px;
  --n-space-section:32px; --n-space-field:20px;

  color:var(--n-foreground); font-family:var(--n-font); font-size:var(--n-type-body); line-height:1.55;
  --background:var(--n-background); --foreground:var(--n-foreground); --secondary:var(--n-soft);
}

.nhi-ui :is(h1,h2,h3,p,dl,dd){margin:0}
.nhi-ui :is(button,input,textarea,select){font:inherit}
.nhi-ui h1{font-size:var(--n-type-title);line-height:1.08;font-weight:400;letter-spacing:-.045em;text-wrap:balance}
.nhi-ui h2{font-size:22px;line-height:1.2;letter-spacing:-.025em;font-weight:500}
.nhi-ui h3{font-size:16px;line-height:1.3;letter-spacing:-.02em;font-weight:500}
.nhi-ui .n-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin:4px 0 30px}
.nhi-ui .n-eyebrow{font:12px/1.6 var(--n-mono);letter-spacing:.06em;color:var(--n-muted);margin-bottom:13px}
.nhi-ui .n-lede{margin-top:16px;color:var(--n-muted);font-size:14px;max-width:670px}
.nhi-ui .n-heading-tools{flex-shrink:0}
.nhi-ui .n-help{font-size:12px;color:var(--n-muted);line-height:1.6}
.nhi-ui .n-mono{font:12px var(--n-mono);letter-spacing:.025em}
.nhi-ui .n-control{display:inline-flex;align-items:center;justify-content:center;gap:var(--n-gap);min-height:var(--n-control-height);height:auto;padding:11px var(--n-control-inset);border:1px solid transparent;border-radius:var(--n-radius);font:600 14px/1.45 var(--n-font);text-decoration:none;white-space:normal;position:relative;cursor:pointer;color:var(--n-foreground);background:transparent;box-shadow:none;transform:none;transition:background-color var(--n-fast),border-color var(--n-fast),box-shadow var(--n-fast);opacity:1;min-width:0}
.nhi-ui .n-control svg{width:18px;height:18px;flex-shrink:0}
.nhi-ui .n-control-body{display:grid;min-width:0;text-align:inherit}
.nhi-ui .n-control-body>span{grid-area:1/1;align-self:center}
.nhi-ui .n-pending-label{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.nhi-ui .n-control[data-variant=primary]{background:var(--n-action);border-color:var(--n-action);color:var(--n-action-text)}
.nhi-ui .n-control[data-variant=secondary]{background:var(--n-background);border-color:var(--n-input-border)}
@media(hover:hover){.nhi-ui .n-control[data-variant=primary]:hover:not(:disabled):not([aria-disabled=true]){background:var(--n-action-hover);border-color:var(--n-action-hover)}.nhi-ui .n-control[data-variant=secondary]:hover:not(:disabled):not([aria-disabled=true]),.nhi-ui .n-control[data-variant=text]:hover:not(:disabled):not([aria-disabled=true]){background:var(--n-soft);border-color:var(--n-input-border)}.nhi-ui .n-control[data-variant=text]:hover:not(:disabled):not([aria-disabled=true]) .n-control-label{text-decoration:underline;text-underline-offset:4px}}

/* Round 27 sample: silver work surfaces, graphite equipment stage, lime actions.
   Applied by the host only to Current work, the exact quote document and Explorer.
   The shared runtime, illustration, records and all other routes are unchanged. */
.nhi-ui[data-visual-system="silver"]{
  --n-canvas:#f4f5f6;--n-background:#fff;--n-foreground:#20262b;--n-muted:#626b73;
  --n-line:#dadee2;--n-input-border:#89939b;--n-soft:#edf0f2;--n-selected:#e4e8eb;
  --n-focus:#27343e;--n-disabled-bg:#e9ecee;--n-disabled-text:#727b82;
  --n-action:#83bf3e;--n-action-text:#14230e;--n-action-hover:#96ce54;--n-action-pressed:#75ad35;
  --n-example:#59636d;--n-example-bg:#edf0f2;--n-example-border:#cfd6dc;
  --n-wait:#275b86;--n-wait-bg:#edf4fa;--n-wait-border:#d5e3ef;
  --n-stage:#151b20;--n-stage-text:#edf2f6;--n-stage-muted:#b2bdc6;--n-stage-line:#39444e;
  --n-radius:6px;
  -webkit-font-smoothing:antialiased;
}
.nhi-ui[data-visual-system="silver"] .n-evidence-example{font-weight:400}
.nhi-ui[data-visual-system="silver"] .n-room-topbar{background:#fff}
.nhi-ui[data-visual-system="silver"] .n-room-journey,.nhi-ui[data-visual-system="silver"] .n-case-navigation{border-color:var(--n-line)}
.nhi-ui[data-visual-system="silver"] .n-case-identity strong{color:var(--n-foreground);font-weight:600}

  --n-background:#253039;--n-canvas:var(--n-stage);--n-soft:#303b44;--n-selected:#3a4650;

  color:var(--n-foreground);background:var(--n-stage);border-radius:6px;overflow:clip;
}

.nhi-ui .p-cap-intro p{font-size:13px;line-height:1.55;color:var(--n-muted);max-width:94ch;margin:0}
.nhi-ui .p-cap-frame{position:relative;border:1px solid var(--n-line);border-radius:7px;overflow:hidden;background:#151b20}
.nhi-ui .p-cap-frame iframe{display:block;width:100%;height:min(720px,76vh);min-height:540px;border:0;background:#151b20}
.nhi-ui .p-cap-loading{position:absolute;inset:0;display:grid;place-content:center;margin:0;pointer-events:none;color:#dbe3e9;font-size:14px;background:#151b20}
.nhi-ui .p-cap-boundary{font-size:12px;line-height:1.6;margin:12px 0 5px;color:var(--n-foreground)}
.nhi-ui .p-cap-storage-note,.nhi-ui .p-cap-fallback{font-size:12px;line-height:1.6;color:var(--n-muted);margin:0}
.nhi-ui .p-cap-fallback{padding:12px 16px;background:var(--n-wait-bg);color:var(--n-wait);margin-top:10px}
.nhi-ui .p-cap-frame iframe[hidden]{display:none!important}
.nhi-ui .p-cap-preview-actions{display:flex;gap:10px;margin:0 0 12px}
.nhi-ui .p-cap-preview-actions .n-control{font-size:13px;min-height:44px}
.nhi-ui .p-cap-error{padding:10px 14px;margin:0 0 10px;background:var(--n-wait-bg);font-size:12px;line-height:1.5}
.nhi-ui .p-cap-error p,.nhi-ui .p-cap-fallback p{margin:0}
.nhi-ui .p-cap-error .n-control,.nhi-ui .p-cap-fallback .n-control{display:inline-flex;min-height:44px;padding:6px 0;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.nhi-ui .p-cap-intro h2:focus-visible{outline:2px solid var(--n-focus);outline-offset:3px}
@media(max-width:700px){
 .nhi-ui .p-capabilities{padding-bottom:76px}
 .nhi-ui .p-cap-header{display:block;margin-bottom:16px}
 .nhi-ui .p-cap-header h1{font-size:25px}
 .nhi-ui .p-cap-header p:not(.n-eyebrow){font-size:13px}
 .nhi-ui .p-cap-header>.n-control{position:fixed;z-index:40;bottom:12px;left:16px;right:16px;margin:0;min-height:46px;background:#fff;box-shadow:0 0 0 12px #f4f5f6}
 .nhi-ui .p-cap-identity{gap:7px;font-size:11px}
 .nhi-ui .p-cap-identity .n-evidence{white-space:normal;font-size:11px}
 .nhi-ui .p-cap-mode{gap:10px;align-items:center;flex-wrap:wrap}
 .nhi-ui .p-cap-mode .n-choice{padding-inline:14px;min-height:42px}
 .nhi-ui .p-cap-intro h2{font-size:17px}
 .nhi-ui .p-cap-intro p{font-size:12px}
 .nhi-ui .p-cap-frame iframe{height:700px;min-height:580px}
}

/* The mobile capability is one focused application viewport. Studio stays
   mounted but hidden/inert during its direct customer preview, preserving the
   original draft and reviewed-state object without a second visible scroller. */
body.nhi-capability-mobile .p-header,body.nhi-capability-mobile .p-boundary{display:none}
body.nhi-capability-mobile .p-capability-main{padding:0;min-height:0}
.nhi-ui .p-capabilities[data-mobile=true]{position:fixed;inset:0;z-index:60;width:100%;height:100vh;height:100dvh;max-width:none;display:flex;flex-direction:column;gap:0;padding:12px 12px max(8px,env(safe-area-inset-bottom));overflow:hidden;background:var(--n-canvas)}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 10px;flex-shrink:0}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header>div{min-width:0}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header .n-eyebrow{font-size:9px;line-height:1.4;letter-spacing:.045em;margin:0 0 4px}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header h1{font-size:18px;line-height:1.2;letter-spacing:-.02em;margin:0;font-weight:600}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header p:not(.n-eyebrow){display:none}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header>.n-control{position:static;box-shadow:none;margin:0;min-height:44px;padding:8px 10px;width:124px;flex-shrink:0;background:#fff;font-size:11px;line-height:1.35;white-space:normal;text-align:center;justify-content:center}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-identity{padding:0 0 9px;flex-shrink:0;border-bottom:1px solid var(--n-line)}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-identity .n-evidence{font-size:10px;line-height:1.4;white-space:normal}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-identity>span:not(.n-evidence){display:none}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-mode{margin:9px 0;flex-shrink:0;min-height:44px}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-mode>.n-control{display:none}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-mode .n-choices{width:100%}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-mode .n-choice{flex:1;min-height:40px;font-size:12px}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-intro{margin:0 0 10px;flex-shrink:0}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-intro h2{font-size:14px;line-height:1.35;margin:0 0 3px}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-intro p{font-size:11px;line-height:1.45;margin:0}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-preview-actions{margin:0 0 10px;flex-shrink:0;gap:8px}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-preview-actions .n-control{flex:1;min-height:44px;font-size:12px;padding:8px;justify-content:center;text-align:center}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-frame{flex:1;min-height:0;border-radius:5px;overscroll-behavior:contain}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-frame iframe{height:100%;min-height:0;width:100%;border:0}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-boundary{flex-shrink:0;font-size:10px;line-height:1.45;margin:7px 0 0}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-storage-note{display:none}
.nhi-ui .p-capabilities[data-mobile=true] .p-cap-fallback{font-size:11px;line-height:1.4;flex-shrink:0;padding:8px 10px}
@media(max-height:650px){.nhi-ui .p-capabilities[data-mobile=true] .p-cap-intro p{display:none}.nhi-ui .p-capabilities[data-mobile=true] .p-cap-header h1{font-size:16px}.nhi-ui .p-capabilities[data-mobile=true]{padding-top:8px}.nhi-ui .p-capabilities[data-mobile=true] .p-cap-intro{margin-bottom:6px}}
